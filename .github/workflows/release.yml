name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 0.1.0）。タグを打たずに成果物を確かめたいときに使う。"
        required: true
        type: string

permissions:
  # ドラフトリリースの作成に要る（softprops/action-gh-release）。
  # checkout とビルドだけなら read で足りる。write はこの 1 ステップのためだけにある。
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # windows-latest には固定しない。jpackage (JDK 21) が要求する WiX は 3.x であり、
    # ランナーイメージが更新されて内容が変わると黙って壊れる。
    # WiX 自体もイメージのプリインストールに頼らず、下で明示的に用意する。
    runs-on: windows-2022
    # ハングしたジョブを 6 時間放置しないための上限。
    # 2026-08-22 実測（起動スモークを含む）で 3 分 26 秒。
    # build より緩くしてあるのは、WiX の取得という外への往復を含むため。
    timeout-minutes: 20

    # uses は SHA でピンしてある。末尾の版コメントは Dependabot が SHA と一緒に
    # 書き換えるので消さないこと（理由は .github/dependabot.yml）。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: バージョンを決める
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            # タグ v0.1.0 から先頭の v を落とす。
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          # MSI の ProductVersion は数値のみ。ここで弾いておかないと jpackage まで気づけない。
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "バージョンが major.minor.build の形ではない: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "バージョン: $version"

      # ビルド中に外へ取りに行くものは、版とハッシュで固定する。配布物のビルド経路に
      # 入ってくるものなので、中身が変わったら気づけないと困る。
      #
      # ★ プリインストールされた WiX があってもそれは使わない。イメージが更新されて版が
      #   変わると、同じタグから作った MSI が別の道具で作られることになる。
      #   GITHUB_PATH は先頭へ足されるので、ここで用意したものが必ず勝つ。
      #
      # ★ SHA256 は 2026-08-22 に公式リリース資産を取って測った。同じ URL に同じ値を
      #   ピンしているプロジェクトが他にもある（tauri-apps/tauri ほか）。
      #   **URL を変えるときは必ずハッシュも測り直すこと。**
      - name: WiX 3.14.1 を用意する
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          WIX_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31
        run: |
          $dir = "$env:RUNNER_TEMP\wix314"
          $zip = "$env:RUNNER_TEMP\wix314-binaries.zip"
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $zip

          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:WIX_SHA256) {
            throw "WiX の SHA256 が一致しない。期待 $env:WIX_SHA256 / 実際 $actual"
          }
          "SHA256 一致: $actual"

          Expand-Archive -Path $zip -DestinationPath $dir -Force
          if (-not (Test-Path "$dir\candle.exe")) { throw "WiX の展開に失敗した" }
          $dir >> $env:GITHUB_PATH

      # ここで落ちたらリリースしない。-Werror とテストを通ったものだけを配る。
      - name: Build
        run: ./gradlew build --stacktrace

      # ★ -P の引数はクォートで囲む。PowerShell から gradlew.bat へ渡る過程で `=` の
      #   前後がトークンとして割れ、Gradle には -Pversion / 0 / .0.1 の 3 つとして届く。
      #   Gradle は `.0.1` をタスク名だと解釈して "Task '.0.1' not found" で落ちる。
      #   ビルドは通ってパッケージだけが落ちるので、リリースのときに初めて分かる形だった。
      - name: Package
        run: ./gradlew :pdf-desktop:packageAll "-Pversion=${{ steps.version.outputs.version }}" --stacktrace

      - name: 成果物を検める
        run: |
          $runtime = "pdf-desktop\build\jpackage\runtime\bin\java.exe"
          $modules = & $runtime --list-modules
          foreach ($required in @("javafx.controls", "javafx.swing", "jdk.localedata")) {
            if (-not ($modules -match "^$([regex]::Escape($required))@")) {
              throw "ランタイムイメージに $required が入っていない"
            }
          }

          $version = "${{ steps.version.outputs.version }}"
          $expected = @(
            "dist\PDFjig-$version.msi",
            "dist\PDFjig-$version.exe",
            "dist\PDFjig-$version-win-x64.zip"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "$file が無い" }
            $size = (Get-Item $file).Length
            # JRE 同梱で 60MB 前後になる。極端に小さいものはランタイムの取り込みに失敗している。
            if ($size -lt 30MB) { throw "$file が小さすぎる: $size バイト" }
            "{0}  {1:N1} MB" -f $file, ($size / 1MB)
          }

      # 中身が揃っていることと、それが実際に立ち上がることは別である。
      # 確かめるのは ZIP だけにしてある。MSI / EXE を入れると、消すところまで含めないと
      # 片手落ちになり、失敗したときにランナーの状態が壊れる。
      # インストーラの挙動は引き続き人が見る（docs/HANDOVER.md 4-4）。
      #
      # ★ shell は powershell（Windows PowerShell 5.1）でなければならない。
      #   このワークフローの既定は pwsh だが、UI Automation のアセンブリは
      #   .NET Framework にしか無く、pwsh では Add-Type の時点で落ちる。
      - name: ZIP から起動することを検める
        shell: powershell
        run: |
          & "tools/smoke/Verify-AppImage.ps1" `
            -ZipPath "dist/PDFjig-${{ steps.version.outputs.version }}-win-x64.zip" `
            -ArtifactDir "$env:RUNNER_TEMP/smoke"

      # UI Automation の失敗は理由が読めない。絵とプロセス一覧が無いと切り分けられない。
      - name: 起動確認の証拠を上げる
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-evidence
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - name: チェックサムを作る
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      # draft で作る。実機で MSI / EXE / ZIP を触ってから公開したい。
      # 壊れた成果物を公開すると、取り下げても既に取得された可能性が残る。
      - name: ドラフトリリースを作る
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: PDFjig ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/PDFjig-${{ steps.version.outputs.version }}.msi
            dist/PDFjig-${{ steps.version.outputs.version }}.exe
            dist/PDFjig-${{ steps.version.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt
