name: build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest は配布対象プラットフォーム、ubuntu-latest は速い一次検証。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブを 6 時間放置しないための上限。
    # 2026-08-22 実測（uiTest を含む）で windows が 5 分 0 秒、ubuntu が 50 秒。
    # 3 倍の余裕を見てある。★ 実測より桁を大きくしない——上限が緩いほど、
    # 遅くなったことに気づくのが遅れる（uiTest が 19 分かかっていたのを 30 分の上限が隠した）。
    timeout-minutes: 15

    # uses は SHA でピンしてある。末尾の版コメントは Dependabot が SHA と一緒に
    # 書き換えるので消さないこと（理由は .github/dependabot.yml）。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build --stacktrace

      # 画面を操作するテスト。デスクトップセッションを要するため windows でだけ回す。
      #
      # ★ ヘッドレス（Monocle）は使っていない。org.testfx:openjfx-monocle:21.0.2 は
      #   JavaFX 21 で Window#_updateViewSize を実装しておらず、表示時に
      #   AbstractMethodError になる（TestFX/Monocle#97）。ランナーは対話セッションを
      #   持つのでそのまま動く。配布対象と同じ描画経路を通る点でも、こちらが正直である。
      #
      # ubuntu で走らせないのはソースセットで担保している（build には含まれない）。
      # if だけに頼ると、uiTest が build に紛れ込んだとき黙って ubuntu でも動き出す。
      - name: UI test
        if: runner.os == 'Windows'
        run: ./gradlew :pdf-desktop:uiTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
