name: build

on:
  # ★ paths-ignore は push と pull_request の両方に書く。on: にしか書けないため、
  #   ジョブ側では絞れない。**片方だけ直さないこと。**
  #   YAML アンカーで 1 か所にまとめる手はあるが採らない。アンカーが解釈されないと
  #   workflow が invalid になって「起動しない」形で失敗し、それは枠切れと区別が付かない
  #   （org の docs/ci-strategy.md §4）。
  #
  # ★ 挙げてよいのは「変わってもビルドの結果が変わらない」ものだけ。
  #   .editorconfig は入れない——ktlint が読むので Spotless の挙動そのものが変わる。
  #   .gitattributes も入れない——Spotless の lineEndings が GIT_ATTRIBUTES_FAST_ALLSAME
  #   で読むので、同じく整形の判定そのものが変わる。
  #   docs/ の中身は 2026-08-23 時点ですべて .md なので、**/*.md で足りる。
  #
  # ★ 該当するもの全部を挙げるのではなく、**実際に踏んだものだけを足す。**
  #   リストが伸びるほど、次に読む者が 1 行ずつ「これは関与しないのか」を確かめる手間が増える。
  #   .github/dependabot.yml は 2026-08-23 に足した——コメントだけの変更で build が
  #   5 分走ったためで、Gradle ビルドには一切関与しない。
  #
  # ★ workflow ファイルは挙げない。.github/workflows/** と書くとこのファイル自身が入り、
  #   **CI の変更が検証されないまま通る**。個別に列挙する手もあるが、workflow を足すたびに
  #   判断が要るようになるので採らない。
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest は配布対象プラットフォーム、ubuntu-latest は速い一次検証。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブを 6 時間放置しないための上限。
    # 2026-08-22 実測（uiTest を含む）で windows が 5 分 0 秒、ubuntu が 50 秒。
    # 3 倍の余裕を見てある。★ 実測より桁を大きくしない——上限が緩いほど、
    # 遅くなったことに気づくのが遅れる（uiTest が 19 分かかっていたのを 30 分の上限が隠した）。
    timeout-minutes: 15

    # uses は SHA でピンしてある。末尾の版コメントは Dependabot が SHA と一緒に
    # 書き換えるので消さないこと（理由は .github/dependabot.yml）。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build --stacktrace

      # 画面を操作するテスト。デスクトップセッションを要するため windows でだけ回す。
      #
      # ★ ヘッドレス（Monocle）は使っていない。org.testfx:openjfx-monocle:21.0.2 は
      #   JavaFX 21 で Window#_updateViewSize を実装しておらず、表示時に
      #   AbstractMethodError になる（TestFX/Monocle#97）。ランナーは対話セッションを
      #   持つのでそのまま動く。配布対象と同じ描画経路を通る点でも、こちらが正直である。
      #
      # ubuntu で走らせないのはソースセットで担保している（build には含まれない）。
      # if だけに頼ると、uiTest が build に紛れ込んだとき黙って ubuntu でも動き出す。
      - name: UI test
        if: runner.os == 'Windows'
        run: ./gradlew :pdf-desktop:uiTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
