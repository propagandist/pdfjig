name: build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest は配布対象プラットフォーム、ubuntu-latest は速い一次検証。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ハングしたジョブを 6 時間放置しないための上限。
    # 2026-08-22 実測（uiTest を含む）で windows が 5 分 0 秒、ubuntu が 50 秒。
    # 3 倍の余裕を見てある。★ 実測より桁を大きくしない——上限が緩いほど、
    # 遅くなったことに気づくのが遅れる（uiTest が 19 分かかっていたのを 30 分の上限が隠した）。
    timeout-minutes: 15

    # uses は SHA でピンしてある。末尾の版コメントは Dependabot が SHA と一緒に
    # 書き換えるので消さないこと（理由は .github/dependabot.yml）。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build
        run: ./gradlew build --stacktrace

      # 画面を操作するテスト。デスクトップセッションを要するため windows でだけ回す。
      #
      # ★ ヘッドレス（Monocle）は使っていない。org.testfx:openjfx-monocle:21.0.2 は
      #   JavaFX 21 で Window#_updateViewSize を実装しておらず、表示時に
      #   AbstractMethodError になる（TestFX/Monocle#97）。ランナーは対話セッションを
      #   持つのでそのまま動く。配布対象と同じ描画経路を通る点でも、こちらが正直である。
      #
      # ubuntu で走らせないのはソースセットで担保している（build には含まれない）。
      # if だけに頼ると、uiTest が build に紛れ込んだとき黙って ubuntu でも動き出す。
      - name: UI test
        if: runner.os == 'Windows'
        run: ./gradlew :pdf-desktop:uiTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
