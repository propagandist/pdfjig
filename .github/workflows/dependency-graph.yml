name: dependency-graph

# 解決済みの依存グラフを GitHub へ渡す。gradle/libs.versions.toml は「宣言」であって、
# 推移依存を含む解決済みのグラフではない。これが無いと Dependabot alerts は直接依存しか
# 見ないので、「依存の CVE を見ている人がいる」と言えなくなる。
# org の基準は propagandist/.github の docs/security-baseline.md §2.2。中身はここへ写さない。
#
# ★ GitHub 設定の「Automatic dependency submission」は有効化しない。
#   あれは全ブランチの全 push で走る。依存グラフが使われるのは既定ブランチだけなのに、
#   org では 9.5 日で 123 回走って月換算 1,100 分（枠の半分以上）を 1 リポジトリで
#   使っていた実測がある。既定ブランチと Gradle のファイルに絞れば同じ効果が得られる。
#
# ★ gradle.lockfile は置いていない。手元で trivy fs を回せる利点はあるが、依存を触るたびに
#   ロックの更新が要る。再現ビルドの要求が出ていない現状では割に合わないと判断した。
#   要求が出たら、この判断から見直すこと。
#
# ★ 2026-08-22 時点、手元で全サブプロジェクトと javafxJmodsPath（jmods の zip を引く
#   独自の構成）の解決が通ることを確認してある。この action は全構成を解決するので、
#   解決できない構成が 1 つでもあると既定ブランチで赤くなる。構成を足したときは見ること。

on:
  push:
    branches: ["develop"]
    paths:
      - "**/build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/dependency-graph.yml"
  # ★ マージ前の確認には使えない。workflow_dispatch は**既定ブランチにこのファイルが
  #   ある**ことを条件に受け付けられるので、作業ブランチから叩くと 404 になる。
  #   これは、依存を触らないまま送り直したいときのための口である。
  workflow_dispatch:

permissions:
  # 依存グラフのスナップショット送信に要る（Dependency submission API）。
  # 他のステップは checkout と依存解決だけで、read で足りる。
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # uses は SHA でピンしてある。末尾の版コメントは Dependabot が SHA と一緒に
    # 書き換えるので消さないこと（理由は .github/dependabot.yml）。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: 依存グラフを送る
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
